<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Tours</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="hero-content">
        <div class="brand-block">
          <p class="eyebrow">Guided city experiences</p>
          <h1>Heritage Tours</h1>
          <p class="header-copy">
            Search historic walks, view them on the map, and book places in a
            few clicks.
          </p>
        </div>

        <section class="auth-panel" aria-labelledby="loginHeading">
          <h2 id="loginHeading">Account</h2>
          <p id="authMessage"></p>

          <form id="loginForm" class="login-form">
            <input
              type="text"
              id="usernameInput"
              placeholder="Username"
              required
            />
            <input
              type="password"
              id="passwordInput"
              placeholder="Password"
              required
            />
            <button type="submit">Login</button>
          </form>

          <button id="logoutBtn" class="secondary-button" style="display: none">
            Logout
          </button>
        </section>
      </div>
    </header>

    <main class="app-shell">
      <section class="search-panel" aria-labelledby="searchHeading">
        <div class="section-heading">
          <h2 id="searchHeading">Find a tour</h2>
          <p>Search by city, or add a theme to narrow the results.</p>
        </div>

        <form id="searchForm" class="search-form">
          <input
            type="text"
            id="cityInput"
            placeholder="Enter city e.g. London"
            required
          />
          <input
            type="text"
            id="themeInput"
            placeholder="Theme e.g. Education"
          />
          <button type="submit">Search</button>
        </form>

        <p id="message" class="status-text"></p>
        <div id="successMessage" class="success hidden"></div>
      </section>

      <div class="content-grid">
        <section class="results-panel" aria-labelledby="resultsHeading">
          <div class="section-heading">
            <h2 id="resultsHeading">Available tours</h2>
          </div>

          <div id="results" class="tour-list"></div>
        </section>

        <section class="bookings-panel" aria-labelledby="bookingsHeading">
          <div class="section-heading">
            <h2 id="bookingsHeading">My bookings</h2>
          </div>

          <div id="myBookings" class="booking-list">
            <p>No bookings found.</p>
          </div>
        </section>
      </div>

      <section class="map-panel" aria-labelledby="mapHeading">
        <div class="section-heading">
          <h2 id="mapHeading">Map</h2>
        </div>
        <div id="map"></div>
      </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- APP JS -->
    <script src="app.js"></script>
  </body>
</html>
